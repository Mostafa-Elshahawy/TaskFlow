<div class="auth-wrapper">
  <mat-card class="auth-card">
    <mat-card-header>
      <div class="auth-logo">
        <mat-icon>task_alt</mat-icon>
      </div>
      <mat-card-subtitle>TASKFLOW</mat-card-subtitle>
      <mat-card-title>Create your account</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
          <mat-hint>Minimum 6 characters</mat-hint>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="loading" style="margin-top: 8px;">
          {{ loading ? 'Creating account…' : 'Register' }}
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <a routerLink="/login">Already have an account? Sign in</a>
    </mat-card-actions>
  </mat-card>
</div>
