<div class="page-container">
  @if (project) {
    <h2>{{ project.name }}</h2>
    <p class="subtitle">{{ project.description }}</p>

    <div class="cards-row">
      <mat-card class="form-card">
        <mat-card-header><mat-card-title>Add Member</mat-card-title></mat-card-header>
        <mat-card-content>
          <form [formGroup]="addMemberForm" (ngSubmit)="addMember()">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>User ID</mat-label>
              <input matInput formControlName="userId" />
            </mat-form-field>
            <button mat-raised-button color="primary" type="submit" [disabled]="addMemberForm.invalid">Add</button>
          </form>
        </mat-card-content>
      </mat-card>

      <mat-card class="form-card">
        <mat-card-header><mat-card-title>Promote to Manager</mat-card-title></mat-card-header>
        <mat-card-content>
          <form [formGroup]="promoteForm" (ngSubmit)="promote()">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>User ID</mat-label>
              <input matInput formControlName="userId" />
            </mat-form-field>
            <button mat-raised-button color="accent" type="submit" [disabled]="promoteForm.invalid">Promote</button>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  } @else {
    <p>Loading project…</p>
  }
</div>
