<div class="page-container">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>Organization Invitation</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (loading) {
        <mat-spinner diameter="40"></mat-spinner>
        <p>Accepting your invitation…</p>
      } @else if (accepted) {
        <h2>Invitation accepted</h2>
        <p>You are now a member of the organization.</p>
        <a mat-raised-button color="primary" routerLink="/organizations">View organizations</a>
      } @else {
        <h2>Unable to accept invitation</h2>
        <p>{{ errorMessage }}</p>
        <a mat-raised-button routerLink="/organizations">Back to organizations</a>
      }
    </mat-card-content>
  </mat-card>
</div>
