<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="sidenav-header">
      <mat-icon>task_alt</mat-icon>
      <span>TaskFlow</span>
    </div>

    <nav>
      <a class="nav-item" routerLink="/tasks" routerLinkActive="active-link">
        <mat-icon>assignment</mat-icon>
        Tasks
      </a>
      <a class="nav-item" routerLink="/projects" routerLinkActive="active-link">
        <mat-icon>folder</mat-icon>
        Projects
      </a>
      <a class="nav-item" routerLink="/organizations" routerLinkActive="active-link">
        <mat-icon>corporate_fare</mat-icon>
        Organizations
      </a>
      <a class="nav-item" routerLink="/users" routerLinkActive="active-link">
        <mat-icon>group</mat-icon>
        Users
      </a>
    </nav>

    <div class="sidenav-footer">
      <button class="logout-btn" (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        Sign out
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
